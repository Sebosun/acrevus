info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "{{createUserEmail}}",
        "password": "ExamplePass123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}.${Math.random().toString(36).slice(2)}`;
        bru.setVar("createUserEmail", `john.${suffix}@example.com`);
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("should return the created user", function() {
          const user = res.body.user;
          expect(user.id).to.be.a("number").and.to.be.above(0);
          expect(user.name).to.equal("John Doe");
          expect(user.email).to.equal(bru.getVar("createUserEmail"));
          expect(user).not.to.have.property("password");
          expect(user).not.to.have.property("Password");
        });

        test("should initialize timestamps and leave the user active", function() {
          const user = res.body.user;
          expect(Number.isNaN(Date.parse(user.created_at))).to.equal(false);
          expect(Number.isNaN(Date.parse(user.updated_at))).to.equal(false);
          expect(user.deleted_at).to.equal(null);
        });

examples:
  - name: User created
    description: Successful response; ID and timestamps are illustrative.
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "John Doe",
            "email": "john@example.com",
            "password": "ExamplePass123!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "user": {
              "id": 1,
              "name": "John Doe",
              "email": "john@example.com",
              "created_at": "2026-09-14T12:00:00Z",
              "updated_at": "2026-09-14T12:00:00Z",
              "deleted_at": null
            }
          }
  - name: Missing password
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "John Doe",
            "email": "john@example.com"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "error": "name, a valid email, and password are required"
          }

docs: |-
  Select the local environment to send POST http://localhost:1234/api/v1/users.
  Send "name", "email", and "password". Responses omit the password hash.
  The before-request script generates a unique email for each run.
  Saved examples document the current 200 success and 400 validation responses.

settings:
  encodeUrl: true
